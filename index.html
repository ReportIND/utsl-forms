<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UTSL Forms">
<title>UTSL Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0b4a3a;--green2:#126b54;--teal:#2b8a9d;--bg:#f2f6f4;--card:#fff;--line:#d9e3de;--ink:#13261f;--mute:#5d6f67;--err:#b42318;--ok:#16794c}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 Sarabun,"Noto Sans Thai",Tahoma,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.hd{max-width:980px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.hd .brand{font-weight:700;color:var(--green);font-size:18px;cursor:pointer}
.hd .sp{flex:1}
.hd .me{font-size:13px;color:var(--mute);text-align:right;line-height:1.2;word-break:break-all}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--green);color:#fff;font-weight:600;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button:hover,.btn:hover{background:var(--green2)}
button.ghost,.btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
button.ghost:hover{background:#eef6f2}
button.sm{min-height:34px;padding:4px 12px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
main{max-width:980px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:24px;margin:8px 0 4px}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.crumb{font-size:14px;color:var(--mute);margin-bottom:6px}
.crumb a{color:var(--teal);cursor:pointer;text-decoration:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--green);box-shadow:0 6px 18px rgba(11,74,58,.12);transform:translateY(-2px)}
.tile .ic{font-size:28px}.tile b{font-size:18px}.tile small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.cols{grid-template-columns:1fr!important}}
.f{display:flex;flex-direction:column;gap:4px}
.f.wide{grid-column:1/-1}
.f span{font-size:14px;font-weight:600;color:var(--mute)}
.f span b{color:var(--err)}
input,textarea,select{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%;min-height:44px;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(43,138,157,.18)}
input.auto{background:#eef8f3;border-color:#9fd3bb}
textarea{resize:vertical}
.login{max-width:440px;margin:40px auto;text-align:center}
.err{color:var(--err);font-size:14px}
.note{background:#fff8e6;border:1px solid #f1dc9a;border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.item{display:grid;grid-template-columns:34px 1fr 1fr 1.2fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.item .n{font-weight:700;color:var(--green);text-align:center}
@media(max-width:720px){.item{grid-template-columns:30px 1fr 1fr}.item .c,.item .ph{grid-column:2/-1}}
.ph{display:flex;align-items:center;gap:8px}
.ph img{height:40px;width:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.fbtn{display:inline-flex;align-items:center;cursor:pointer;background:#fff;color:var(--green);border:1.5px solid var(--green);border-radius:10px;padding:4px 12px;font-weight:600;min-height:34px;font-size:14px}
.fbtn.lg{padding:10px 16px;min-height:44px;font-size:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.gal figure{margin:0;position:relative;background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:6px}
.gal img{width:100%;height:100px;object-fit:cover;border-radius:6px}
.gal input{min-height:34px;padding:4px 8px;font-size:14px;margin-top:4px}
.gal button{position:absolute;top:2px;right:2px;min-height:26px;padding:0 8px;border-radius:50%;background:#000a;font-size:14px}
.sig{border:1.5px dashed var(--line);border-radius:12px;background:#fcfdfc;touch-action:none;width:100%;height:150px;display:block}
.sigrow{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.chk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
.chk label{display:flex;gap:8px;align-items:center;min-height:36px}
.chk input{width:22px;height:22px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sticky{position:fixed;left:0;right:0;bottom:0;background:#fffe;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:15}
.sticky .in{max-width:980px;margin:0 auto;display:flex;gap:10px;justify-content:flex-end}
.qrow{display:grid;grid-template-columns:34px 1fr 170px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.qrow .n{font-weight:700;color:var(--green);text-align:center}
@media(max-width:720px){.qrow{grid-template-columns:30px 1fr}.qrow select{grid-column:2/-1}}
.blk{margin-bottom:14px}
.ov{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;color:#fff;font-size:18px;text-align:center;padding:20px}
.ov.on{display:flex}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#13261f;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;display:none;max-width:90%}
.ok{color:var(--ok);font-weight:600}
/* เลือกเลขที่ใบสั่งงาน */
.jobs{display:flex;flex-direction:column;gap:10px}
.job{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.job:hover,.job:focus{border-color:var(--green);outline:none;box-shadow:0 4px 14px rgba(11,74,58,.1)}
.job .no{font-weight:700;color:var(--green);word-break:break-all}
.job .cu{font-size:15px}
.job small{color:var(--mute);display:block;grid-column:1/-1}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:700;background:#e7f5ef;color:var(--green);margin-right:4px}
.tag.done{background:#fff3bf;color:#7a5b00}
.picked{background:#e7f5ef;border:1.5px solid #9fd3bb;border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.picked b{color:var(--green);word-break:break-all}
.picked .sp{flex:1}
.steps{margin:6px 0 0;padding-left:20px}.steps li{margin:4px 0}
.demo{background:#fff3bf;color:#5c4400;text-align:center;font-size:13px;padding:4px 10px}
</style>
</head>
<body>
<header>
  <div class="demo" id="demo" style="display:none">โหมดทดลอง — ยังไม่ได้เชื่อม Microsoft: ใช้รายการงานตัวอย่าง · ดาวน์โหลด PDF ได้ แต่ยังไม่อัปโหลด SharePoint และไม่ส่งอีเมล</div>
  <div class="hd">
    <span class="brand" onclick="go('#/home')">UTSL Forms</span>
    <div class="sp"></div>
    <div class="me" id="me"></div>
    <button class="ghost sm" id="btnOut" style="display:none">ออกจากระบบ</button>
  </div>
</header>
<main id="view"></main>
<div class="ov" id="ov"><div id="ovt">กำลังประมวลผล...</div></div>
<div class="toast" id="toast"></div>
<script src="lib/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="config.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
</html>
